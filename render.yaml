# Render Blueprint for the CardioVision backend (FastAPI + PyTorch).
# In Render: New > Blueprint > pick this repo. It reads this file automatically.
services:
  - type: web
    name: cardiovision-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_KIND
        value: unet
